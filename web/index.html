<!doctype html><meta charset="utf-8"><title>CoD2 Demo Archive</title>
<style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#111;color:#eee}input,button{padding:10px;margin:4px;background:#222;color:#eee;border:1px solid #555;border-radius:4px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #333;text-align:left}a{color:#8bd}</style>
<h1>CoD2 Demo Archive</h1><form id="f"><input name="map" placeholder="Map"><input name="player" placeholder="Player"><input name="team" placeholder="Team"><input name="date" placeholder="Date (YYYY-MM-DD)"><button>Search</button></form><table><thead><tr><th>Date</th><th>Map</th><th>Player</th><th>Teams</th><th>Size</th><th></th></tr></thead><tbody id="out"></tbody></table>
<script>f.onsubmit=async e=>{e.preventDefault();let p=new URLSearchParams(new FormData(f));let a=await (await fetch('/api/demos?'+p)).json();out.innerHTML=a.map(x=>`<tr><td>${x.playedAt||x.createdAt}</td><td>${x.map}</td><td>${x.player}</td><td>${x.homeTeam} ${x.awayTeam}</td><td>${(x.size/1048576).toFixed(1)} MB</td><td><a href="${x.downloadURL}">download</a></td></tr>`).join('')};f.requestSubmit()</script>
